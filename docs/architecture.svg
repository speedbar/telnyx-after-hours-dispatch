<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
  </defs>
  <rect width="1060" height="640" fill="#ffffff"/>
  <text x="30" y="30" font-size="18" font-weight="700" fill="#0f172a">After-hours urgent-call dispatch: architecture (as built, 19 Nov 2026)</text>

  <!-- Caller -->
  <rect x="30" y="140" width="120" height="76" rx="10" fill="#f1f5f9" stroke="#334155"/>
  <text x="90" y="170" text-anchor="middle" font-weight="700">Caller</text>
  <text x="90" y="190" text-anchor="middle" font-size="11">phone number (pending)</text>
  <text x="90" y="205" text-anchor="middle" font-size="11">or Portal Test assistant</text>
  <line x1="150" y1="178" x2="190" y2="178" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Assistant -->
  <rect x="190" y="56" width="260" height="270" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="320" y="82" text-anchor="middle" font-weight="700" fill="#1e3a8a">Telnyx AI Assistant "dispatch-ai"</text>
  <text x="320" y="102" text-anchor="middle" font-size="12">Conversation Workflow (7 nodes)</text>
  <text x="320" y="120" text-anchor="middle" font-size="12">model: GLM-5.3-Flash (voice)</text>
  <text x="320" y="146" text-anchor="middle" font-size="12">LLM used only inside prompt nodes:</text>
  <text x="320" y="164" text-anchor="middle" font-size="12">triage, detail capture, wording</text>
  <text x="320" y="190" text-anchor="middle" font-size="12">Code decides actions:</text>
  <text x="320" y="208" text-anchor="middle" font-size="12">reserve, retries, escalation</text>
  <text x="320" y="240" text-anchor="middle" font-size="12">Greeting + safety line at assistant level</text>
  <text x="320" y="258" text-anchor="middle" font-size="12">Scripted hazard sentences (Details)</text>
  <text x="320" y="290" text-anchor="middle" font-size="11" fill="#475569">Tools are assistant-level: the server</text>
  <text x="320" y="306" text-anchor="middle" font-size="11" fill="#475569">enforces order and inputs (BUG-006)</text>

  <!-- Edge function -->
  <rect x="500" y="56" width="250" height="270" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="625" y="80" text-anchor="middle" font-weight="700" fill="#14532d">Edge Compute function "dispatch"</text>
  <text x="625" y="97" text-anchor="middle" font-size="11">TypeScript, one umbrella project</text>
  <rect x="516" y="112" width="218" height="46" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="625" y="131" text-anchor="middle" font-weight="700">POST /dv</text>
  <text x="625" y="148" text-anchor="middle" font-size="11">dynamic variables, Ed25519 verified</text>
  <rect x="516" y="168" width="218" height="46" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="625" y="187" text-anchor="middle" font-weight="700">POST /mcp</text>
  <text x="625" y="204" text-anchor="middle" font-size="11">4 tools, bearer token, JSON-RPC</text>
  <rect x="516" y="224" width="218" height="46" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="625" y="243" text-anchor="middle" font-weight="700">/admin/seed, /admin/tech</text>
  <text x="625" y="260" text-anchor="middle" font-size="11">admin token, ops and tests</text>
  <text x="625" y="294" text-anchor="middle" font-size="11">GET /health (booleans only)</text>
  <text x="625" y="312" text-anchor="middle" font-size="11">JSON logs with request_id</text>

  <!-- Actors and KV -->
  <rect x="790" y="56" width="240" height="190" rx="12" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
  <text x="910" y="80" text-anchor="middle" font-weight="700" fill="#713f12">Stateful Actors (hot path)</text>
  <rect x="806" y="94" width="208" height="38" rx="8" fill="#ffffff" stroke="#a16207"/>
  <text x="910" y="118" text-anchor="middle" font-size="12">DirectoryActor: customer, flags</text>
  <rect x="806" y="140" width="208" height="38" rx="8" fill="#ffffff" stroke="#a16207"/>
  <text x="910" y="164" text-anchor="middle" font-size="12">TechnicianActor: atomic hold + TTL</text>
  <rect x="806" y="186" width="208" height="38" rx="8" fill="#ffffff" stroke="#a16207"/>
  <text x="910" y="210" text-anchor="middle" font-size="12">JobActor: job record, one per call</text>
  <rect x="790" y="262" width="240" height="64" rx="12" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="910" y="288" text-anchor="middle" font-weight="700" fill="#4c1d95">KV: DISPATCH_KV</text>
  <text x="910" y="308" text-anchor="middle" font-size="11">durable copy, off the voice path</text>

  <!-- arrows assistant -> edge -->
  <polyline points="450,135 500,135" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="452" y="126" font-size="10" fill="#334155">1 call start</text>
  <polyline points="450,191 500,191" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="452" y="182" font-size="10" fill="#334155">2 tool calls</text>
  <!-- edge -> actors -->
  <polyline points="750,135 790,135" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <polyline points="750,191 790,191" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <polyline points="750,247 770,247 770,294 790,294" fill="none" stroke="#334155" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="752" y="342" font-size="10" fill="#334155">seed writes KV (dashed)</text>

  <!-- Workflow band -->
  <text x="30" y="384" font-size="14" font-weight="700" fill="#0f172a">Conversation Workflow, as built (blue = prompt node, teal = speak node, grey = tool node)</text>
  <rect x="30" y="410" width="110" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="85" y="441" text-anchor="middle" font-weight="700">Triage</text>
  <rect x="160" y="410" width="110" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="215" y="441" text-anchor="middle" font-weight="700">Details</text>
  <rect x="290" y="410" width="110" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="345" y="441" text-anchor="middle" font-weight="700">Reserve</text>
  <rect x="420" y="410" width="110" height="52" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="475" y="441" text-anchor="middle" font-weight="700">Job</text>
  <rect x="550" y="410" width="110" height="52" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="605" y="441" text-anchor="middle" font-weight="700">Close (speak)</text>
  <rect x="680" y="410" width="110" height="52" rx="8" fill="#e2e8f0" stroke="#475569"/>
  <text x="735" y="441" text-anchor="middle" font-weight="700">Hang Up (tool)</text>
  <line x1="140" y1="436" x2="160" y2="436" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="270" y1="436" x2="290" y2="436" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="400" y1="436" x2="420" y2="436" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="530" y1="436" x2="550" y2="436" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="660" y1="436" x2="680" y2="436" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="355" y="520" width="150" height="52" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="430" y="551" text-anchor="middle" font-weight="700">Fallback</text>
  <polyline points="345,462 345,545 355,545" fill="none" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="475,462 475,490 430,490 430,520" fill="none" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="505,546 605,546 605,462" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="30" y="500" font-size="11" fill="#475569">Edges between prompt nodes are LLM conditions.</text>
  <text x="30" y="516" font-size="11" fill="#475569">Close to Hang Up is a default edge.</text>
  <text x="30" y="532" font-size="11" fill="#475569">Red: reserve or create_job failed.</text>
  <text x="30" y="548" font-size="11" fill="#475569">Kill-switch and time-cap edges: planned.</text>

  <!-- Observability -->
  <rect x="830" y="400" width="200" height="190" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="930" y="424" text-anchor="middle" font-weight="700" fill="#7c2d12">Observability</text>
  <text x="930" y="448" text-anchor="middle" font-size="11">JSON log line (15 keys)</text>
  <text x="930" y="464" text-anchor="middle" font-size="11">request_id, call_ref, node</text>
  <text x="930" y="480" text-anchor="middle" font-size="11">telnyx-edge logs, metrics</text>
  <text x="930" y="496" text-anchor="middle" font-size="11">(p50/p95, 5xx per function)</text>
  <text x="930" y="520" text-anchor="middle" font-size="11">Portal Conversation History:</text>
  <text x="930" y="536" text-anchor="middle" font-size="11">transcript, tool calls,</text>
  <text x="930" y="552" text-anchor="middle" font-size="11">flow_node_id per turn</text>
  <text x="930" y="576" text-anchor="middle" font-size="10" fill="#7c2d12">No phone numbers in logs</text>
  <text x="30" y="614" font-size="11" fill="#475569">Technician data, customer directory and technician contact are mocked. No technician is phoned in this build.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
