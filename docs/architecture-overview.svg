<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44566c"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="898" height="728" rx="10" fill="#ffffff" stroke="#c5d0dc" stroke-width="2"/>
  <path d="M1,11 a10,10 0 0 1 10,-10 h878 a10,10 0 0 1 10,10 v45 h-898 z" fill="#0f2a43"/>
  <text x="28" y="36" font-size="19" font-weight="700" fill="#ffffff">After-hours urgent-call dispatch: architecture</text>
  <text x="872" y="36" font-size="12" fill="#b9c8d8" text-anchor="end">As built, 22 Nov 2026</text>

  <!-- layer 1 -->
  <rect x="40" y="90" width="150" height="66" rx="6" fill="#ffffff" stroke="#5b7a99" stroke-width="1.5"/>
  <text x="115" y="119" font-size="14" font-weight="700" fill="#1c2b3a" text-anchor="middle">Caller</text>
  <text x="115" y="138" font-size="12" fill="#44566c" text-anchor="middle">rings the number</text>

  <rect x="270" y="80" width="370" height="86" rx="6" fill="#e8f4ee" stroke="#4f8f78" stroke-width="1.5"/>
  <text x="455" y="106" font-size="14" font-weight="700" fill="#1c2b3a" text-anchor="middle">Telnyx AI Assistant</text>
  <text x="455" y="126" font-size="12" fill="#33495e" text-anchor="middle">Conversation Workflow, 7 nodes</text>
  <text x="455" y="145" font-size="12" fill="#33495e" text-anchor="middle">Triage, Details, Reserve, Job, Close (speak), Hang Up</text>

  <rect x="700" y="90" width="160" height="66" rx="6" fill="#e8f4ee" stroke="#4f8f78" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="780" y="119" font-size="14" font-weight="700" fill="#1c2b3a" text-anchor="middle">Transfer tool</text>
  <text x="780" y="138" font-size="12" fill="#33495e" text-anchor="middle">human accepts by voice</text>

  <line x1="190" y1="123" x2="268" y2="123" stroke="#44566c" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="640" y1="123" x2="698" y2="123" stroke="#44566c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="669" y="112" font-size="10" fill="#44566c" text-anchor="middle">on request</text>

  <!-- layer 2: edge function -->
  <rect x="40" y="200" width="820" height="292" rx="8" fill="#f2f6fa" stroke="#9fb3c8" stroke-width="1.5"/>
  <text x="840" y="222" font-size="12" font-weight="700" fill="#33495e" text-anchor="end">Telnyx Edge function: dispatch (TypeScript)</text>

  <polyline points="330,166 330,186 145,186 145,240" fill="none" stroke="#44566c" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="236" y="180" font-size="10" fill="#44566c" text-anchor="middle">1. call start</text>
  <line x1="470" y1="166" x2="470" y2="238" stroke="#44566c" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="478" y="186" font-size="10" fill="#44566c">2. tool calls</text>

  <rect x="60" y="240" width="170" height="56" rx="6" fill="#ffffff" stroke="#5b7a99" stroke-width="1.5"/>
  <text x="145" y="263" font-size="13" font-weight="700" fill="#1c2b3a" text-anchor="middle">POST /dv</text>
  <text x="145" y="282" font-size="11" fill="#44566c" text-anchor="middle">dynamic variables</text>

  <rect x="330" y="240" width="280" height="56" rx="6" fill="#ffffff" stroke="#5b7a99" stroke-width="1.5"/>
  <text x="470" y="263" font-size="13" font-weight="700" fill="#1c2b3a" text-anchor="middle">POST /mcp</text>
  <text x="470" y="282" font-size="11" fill="#44566c" text-anchor="middle">reserve, create_job, release</text>

  <rect x="650" y="240" width="190" height="56" rx="6" fill="#ffffff" stroke="#5b7a99" stroke-width="1.5"/>
  <text x="745" y="263" font-size="13" font-weight="700" fill="#1c2b3a" text-anchor="middle">POST /voice-events</text>
  <text x="745" y="282" font-size="11" fill="#44566c" text-anchor="middle">call events, Ed25519 verified</text>

  <line x1="145" y1="296" x2="145" y2="328" stroke="#44566c" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="400" y1="296" x2="370" y2="328" stroke="#44566c" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="540" y1="296" x2="550" y2="328" stroke="#44566c" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="745" y1="296" x2="745" y2="328" stroke="#44566c" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="60" y="330" width="170" height="56" rx="6" fill="#e3eefa" stroke="#3f6fa3" stroke-width="1.5"/>
  <text x="145" y="353" font-size="13" font-weight="700" fill="#1c2b3a" text-anchor="middle">DirectoryActor</text>
  <text x="145" y="372" font-size="11" fill="#44566c" text-anchor="middle">customers, mode flags</text>

  <rect x="290" y="330" width="160" height="56" rx="6" fill="#e3eefa" stroke="#3f6fa3" stroke-width="1.5"/>
  <text x="370" y="353" font-size="13" font-weight="700" fill="#1c2b3a" text-anchor="middle">TechnicianActor</text>
  <text x="370" y="372" font-size="11" fill="#44566c" text-anchor="middle">atomic hold, expires</text>

  <rect x="470" y="330" width="160" height="56" rx="6" fill="#e3eefa" stroke="#3f6fa3" stroke-width="1.5"/>
  <text x="550" y="353" font-size="13" font-weight="700" fill="#1c2b3a" text-anchor="middle">JobActor</text>
  <text x="550" y="372" font-size="11" fill="#44566c" text-anchor="middle">one per call</text>

  <rect x="650" y="330" width="190" height="56" rx="6" fill="#ffffff" stroke="#5b7a99" stroke-width="1.5"/>
  <text x="745" y="353" font-size="13" font-weight="700" fill="#1c2b3a" text-anchor="middle">Ring + SMS logic</text>
  <text x="745" y="372" font-size="11" fill="#44566c" text-anchor="middle">pure reducer + runner</text>

  <line x1="630" y1="358" x2="648" y2="358" stroke="#44566c" stroke-width="1.5" marker-end="url(#ah)"/>

  <line x1="145" y1="386" x2="145" y2="422" stroke="#44566c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/>
  <text x="153" y="408" font-size="10" fill="#44566c">seed</text>
  <rect x="60" y="424" width="170" height="52" rx="6" fill="#fdf3e3" stroke="#b8812f" stroke-width="1.5"/>
  <text x="145" y="446" font-size="13" font-weight="700" fill="#1c2b3a" text-anchor="middle">KV: DISPATCH_KV</text>
  <text x="145" y="464" font-size="11" fill="#44566c" text-anchor="middle">durable copy, off the call path</text>

  <rect x="260" y="424" width="360" height="52" rx="6" fill="#ffffff" stroke="#9fb3c8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="440" y="446" font-size="12" font-weight="700" fill="#1c2b3a" text-anchor="middle">Observability (no phone numbers logged)</text>
  <text x="440" y="465" font-size="11" fill="#44566c" text-anchor="middle">JSON logs, latency timers, /health, /admin/job-state</text>

  <!-- layer 3 -->
  <line x1="680" y1="386" x2="640" y2="538" stroke="#44566c" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="800" y1="386" x2="800" y2="538" stroke="#44566c" stroke-width="1.5" marker-end="url(#ah)"/>

  <rect x="520" y="540" width="170" height="64" rx="6" fill="#e8f4ee" stroke="#4f8f78" stroke-width="1.5"/>
  <text x="605" y="566" font-size="13" font-weight="700" fill="#1c2b3a" text-anchor="middle">Telnyx Call Control</text>
  <text x="605" y="585" font-size="11" fill="#33495e" text-anchor="middle">dial, speak, DTMF</text>

  <rect x="720" y="540" width="140" height="64" rx="6" fill="#e8f4ee" stroke="#4f8f78" stroke-width="1.5"/>
  <text x="790" y="566" font-size="13" font-weight="700" fill="#1c2b3a" text-anchor="middle">Telnyx Messaging</text>
  <text x="790" y="585" font-size="11" fill="#33495e" text-anchor="middle">SMS</text>

  <!-- layer 4 -->
  <line x1="590" y1="604" x2="575" y2="652" stroke="#44566c" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="548" y="628" font-size="10" fill="#44566c" text-anchor="end">ring</text>
  <line x1="745" y1="604" x2="655" y2="652" stroke="#44566c" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="672" y="624" font-size="10" fill="#44566c" text-anchor="end">details SMS</text>
  <line x1="820" y1="604" x2="820" y2="652" stroke="#44566c" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="828" y="634" font-size="10" fill="#44566c">alert</text>

  <rect x="500" y="654" width="170" height="56" rx="6" fill="#ffffff" stroke="#5b7a99" stroke-width="1.5"/>
  <text x="585" y="678" font-size="13" font-weight="700" fill="#1c2b3a" text-anchor="middle">On-call technician</text>
  <text x="585" y="697" font-size="11" fill="#44566c" text-anchor="middle">phone and SMS</text>

  <rect x="730" y="654" width="130" height="56" rx="6" fill="#ffffff" stroke="#5b7a99" stroke-width="1.5"/>
  <text x="795" y="678" font-size="13" font-weight="700" fill="#1c2b3a" text-anchor="middle">Manager</text>
  <text x="795" y="697" font-size="11" fill="#44566c" text-anchor="middle">if nobody accepts</text>

  <!-- notes -->
  <rect x="40" y="520" width="440" height="190" rx="8" fill="#f8fafc" stroke="#c5d0dc" stroke-width="1.5"/>
  <text x="60" y="548" font-size="13" font-weight="700" fill="#1c2b3a">How to read this</text>
  <text x="60" y="574" font-size="12" fill="#33495e"><tspan font-weight="700">Model:</tspan> talks and extracts details inside workflow nodes.</text>
  <text x="60" y="598" font-size="12" fill="#33495e"><tspan font-weight="700">Code:</tspan> reserve, ring, retries, SMS and caps are deterministic.</text>
  <text x="60" y="622" font-size="12" fill="#33495e"><tspan font-weight="700">State:</tspan> Stateful Actors on the call path, KV is the durable copy.</text>
  <text x="60" y="646" font-size="12" fill="#33495e"><tspan font-weight="700">Switches:</tspan> ring and SMS modes off, dry_run or live; +61 only.</text>
  <text x="60" y="670" font-size="12" fill="#33495e"><tspan font-weight="700">Mock:</tspan> technicians, customers and the roster.</text>
  <text x="60" y="696" font-size="11" fill="#6b7c8f">Dashed box or line = optional path. Call events return on /voice-events.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
